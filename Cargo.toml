[package]
name = "mdir"
version = "0.1.0"
edition = "2024"
description = "R Mdir: Mdir-inspired two-pane terminal file manager for macOS, Linux, Haiku, S3 and R2"
license = "MIT"

[dependencies]
anyhow = "1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
chrono = "0.4"
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
toml = "0.9"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1


[[bin]]
name = "m"
path = "src/main.rs"

[target.'cfg(target_os = "haiku")'.dependencies]
libc = "0.2"
# Haiku는 mio가 poll(2) 백엔드를 쓰는데, 이벤트 후 fd 관심을 지우고 do_io 재등록을 기대한다.
# crossterm은 fd를 직접 읽어 재등록하지 않으므로 첫 입력 이후 키가 오지 않는다. mio 대신 /dev/tty 폴링을 쓴다.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
